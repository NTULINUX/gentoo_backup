#
# Global portage options
#

# SMT enabled on 8-core/16-thread processor
# Compile with 16 threads, and 2 jobs at once (16 * 2 = 32)
# emerge tends to only run one job at a time so double it
MAKEOPTS="-j16"
EMERGE_PARALLEL_OPTS="-j2"

USE_GLOBAL_DISABLE="-backlight -cet -debug -debuginfod -deprecated -doc -dracut -initramfs -iptables -pic -pie -smartcard -ssp -tls-heartbeat -touchpad -xscreensaver"

# Disable codecs and such (avoid possible licensing issues)
USE_MULTIMEDIA="-a52 -aac -dts -openh264 -proprietary-codecs -x264 -x265"

# Final USE flags for production environment
USE="X acl admin aio alsa alsa-plugin ap apng appindicator avif bindist
     bluetooth boost branding brotli cairo caps cpudetection cups cxx dav1d
     dbus drm egl elogind encode exif ffmpeg fftw filecaps flac fontconfig gbm
     gif gles1 gles2 grub gtk gtk3 harfbuzz http2 hwaccel hwloc icu
     imagemagick introspection io-uring iproute2 jit jpeg lame lcms libass
     libcanberra libdrm libnotify libplacebo libsamplerate libunwind lock lto
     lximage lz4 lzma lzo matroska modules-compress mount mp3 mpg123
     multimedia ncurses network nftables nss numpy ogg opengl openmp opus pam
     pdf pdfium pgo pipewire png policykit postproc postscript ppds pulseaudio
     pyside6 python qml qmlls qt6 rubberband smp sound-server
     startup-notification svg svg2 system-harfbuzz system-icu system-jpeg
     system-libevent system-png system-sqlite system-ssl tbb tcl theora
     threads tiff tk tkip tray truetype udev udisks upower v4l vaapi vala
     vdpau vorbis vulkan wayland webchannel webengine webp wps xattr xcb xfce
     xinerama xml xv xvfb xxhash ${USE_GLOBAL_DISABLE} ${USE_MULTIMEDIA}"

# X86-specific CPU instructions (x86-64-v3 psABI)
# pclmul is not included in x86-64-v3 psABI however this is usually detected at run-time anyway
CPU_FLAGS_X86="avx avx2 f16c fma3 mmx mmxext pclmul popcnt sse sse2 sse3 ssse3 sse4_1 sse4_2"

# LLVM and X.org drivers
INPUT_DEVICES="libinput"
LLVM_TARGETS="AMDGPU NVPTX"
VIDEO_CARDS="amdgpu intel lavapipe nouveau nvk r600 radeon radeonsi vesa"

# Exclude FFmpeg tools
FFTOOLS=""

GENTOO_MIRRORS="https://gentoo.osuosl.org/"

L10N="en en-CA en-GB en-US"

#
# DO NOT MODIFY BELOW THIS LINE
#

# glibc
CHOST="x86_64-pc-linux-gnu"

ACCEPT_KEYWORDS="~amd64"

LC_MESSAGES=C.UTF-8

PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"

# Mask useless SystemD service files
MASK_SYSTEMD_FILES="/lib/systemd/*.service /lib/systemd/*/*.service /usr/lib/systemd/*.service /usr/lib/systemd/*/*.service"
# Mask broken X.org session files
MASK_XSESSION_FILES="/usr/share/xsessions/Xsession.desktop /usr/share/xsessions/plasmax11.desktop"
# Mask broken Wayland session files
MASK_WAYLAND_FILES="/usr/share/wayland-sessions/*.desktop"
INSTALL_MASK="${INSTALL_MASK} ${MASK_SYSTEMD_FILES} ${MASK_XSESSION_FILES} ${MASK_WAYLAND_FILES}"

# Always include build dependencies, respect parallel job options
EMERGE_DEFAULT_OPTS="--with-bdeps=y ${EMERGE_PARALLEL_OPTS}"

# Use GCC toolchain for LTO
AR="gcc-ar"
NM="gcc-nm"
RANLIB="gcc-ranlib"

# Global compiler/linker flags
COMMON_FLAGS="-O3 -march=x86-64-v3 -fomit-frame-pointer -flto -pipe"
RUSTFLAGS="-C opt-level=3 -C target-cpu=x86-64-v3"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
LDFLAGS="${LDFLAGS} ${COMMON_FLAGS} -fuse-ld=bfd -Wl,--strip-debug"

# Initial USE flags for bootstrapping
# USE="${USE_GLOBAL_DISABLE} ${USE_MULTIMEDIA} bindist caps filecaps hwloc jit lto nss pam pgo smp threads xattr"

LLVM_SLOT="21"

LUA_TARGETS="lua5-4"
LUA_SINGLE_TARGET="lua5-4"

PYTHON_TARGETS="python3_14"
PYTHON_SINGLE_TARGET="python3_14"

RUBY_TARGETS="ruby33"

# Support both UEFI and legacy installations of GRUB
GRUB_PLATFORMS="efi-64 pc"
